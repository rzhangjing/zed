#
# Octos
#
# Merged from the octos workspace (see the `members` list above). Everything in
# this section is additive: it is what Octos' crates inherit through
# `foo.workspace = true`. Zed's table above is untouched except for the two
# feature unions and the version conflicts documented at the end of this
# section.
#

# Octos internal crates
octos-core = { path = "crates/octos/octos-core" }
octos-diagnostics = { path = "crates/octos/octos-diagnostics" }
octos-research = { path = "crates/octos/octos-research" }
octos-memory = { path = "crates/octos/octos-memory" }
octos-llm = { path = "crates/octos/octos-llm" }
octos-agent = { path = "crates/octos/octos-agent" }
octos-bus = { path = "crates/octos/octos-bus" }
octos-workflows = { path = "crates/octos/octos-workflows" }
octos-server = { path = "crates/octos/octos-server" }
octos-store = { path = "crates/octos/octos-store" }
octos-services = { path = "crates/octos/octos-services" }
octos-pipeline = { path = "crates/octos/octos-pipeline" }
octos-plugin = { path = "crates/octos/octos-plugin" }
octos-swarm = { path = "crates/octos/octos-swarm" }
octos-fleet = { path = "crates/octos/octos-fleet" }
octos-fleet-worker = { path = "crates/octos/octos-fleet-worker" }
octos-embed-llama = { path = "crates/octos/octos-embed-llama" }
# The Octos kernel as a library. Zed embeds `octos_cli::embedded::serve_io`
# in-process instead of spawning the `octos` binary; see
# `crates/framework/zed/src/zed/octos.rs`. `default-features = false` keeps the CLI's
# default `embed-llama` (libclang) and `impersonate` (BoringSSL/cmake) builds
# out of a host's build; consumers add the features they need (`api` for Zed).
octos-cli = { path = "crates/octos/octos-cli", default-features = false }

# codex-rs crates (reused by Octos; fetched from the openai/codex git repo)
codex-execpolicy = { git = "https://github.com/openai/codex", path = "codex-rs/execpolicy" }
codex-state = { git = "https://github.com/openai/codex", path = "codex-rs/state" }
