[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

# Octos' workspace denied `unsafe_code` here. That cannot be merged into this
# table as-is: 186 of the 190 Zed members opt into `[lints] workspace = true`
# (including gpui_windows, gpui, terminal and sqlez, which are full of FFI
# `unsafe`), so a workspace-wide deny would break the existing build.
# To restore the Octos policy, either:
#   * add `unsafe_code = "deny"` to `[lints.rust]` in each Octos crate (26 of
#     its 39 members opt into the workspace table today), or
#   * re-add the deny here and give every Zed crate that needs it an explicit
#     `unsafe_code = "allow"` override.
# unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

declare_interior_mutable_const = "deny"

redundant_clone = "deny"
disallowed_methods = "deny"

# We currently do not restrict any style rules
# as it slows down shipping code to Zed.
#
# Running ./script/clippy can take several minutes, and so it's
# common to skip that step and let CI do it. Any unexpected failures
# (which also take minutes to discover) thus require switching back
# to an old branch, manual fixing, and re-pushing.
#
# In the future we could improve this by either making sure
# Zed can surface clippy errors in diagnostics (in addition to the
# rust-analyzer errors), or by having CI fix style nits automatically.
style = { level = "allow", priority = -1 }

# Individual rules that have violations in the codebase:
type_complexity = "allow"
let_underscore_future = "allow"

# Motivation: We use `vec![a..b]` a lot when dealing with ranges in text, so
# warning on this rule produces a lot of noise.
single_range_in_vec_init = "allow"

# in Rust it can be very tedious to reduce argument count without
# running afoul of the borrow checker.
too_many_arguments = "allow"

# We often have large enum variants yet we rarely actually bother with splitting them up.
large_enum_variant = "allow"

# Boolean expressions can be hard to read, requiring only the minimal form gets in the way
nonminimal_bool = "allow"


# Dylint discovers our custom lints through this entry, so `cargo dylint --all`
# runs them without a `--path` argument. The `lints` package pins its own
# nightly toolchain (see `tooling/lints/rust-toolchain.toml`) and is kept out of
# this workspace on purpose.
[workspace.metadata.dylint]
libraries = [{ path = "tooling/lints" }]

# Octos' release tooling (git-cliff + shared workspace version), merged in from
# the octos workspace.
[workspace.metadata.release]
shared-version = true
consolidate-commits = true
tag-name = "v{{version}}"
tag-message = "Release {{version}}"
pre-release-commit-message = "chore: release {{version}}"
pre-release-hook = ["git-cliff", "-o", "CHANGELOG.md", "--tag", "v{{version}}"]
publish = false
