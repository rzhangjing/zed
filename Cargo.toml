#
# dameng
#
# Transcribed from `D:\Rust\dameng\Cargo.toml`, dameng's own workspace root,
# which is the authority for these versions and feature lists while the tree is
# untracked. Keys dameng shares with Zed (`bytes`, `chrono`, `thiserror`,
# `tracing`, `tokio`, `syn`, `quote`, `proc-macro2`, `proptest`, `async-trait`)
# are deliberately *not* repeated below: this table is the only declarations
# cargo reads, so repeating them would fork the version Zed already pins.
#
# Two constraints worth keeping:
#
# * `odbc-api` must never grow the `narrow` feature. It turns `SqlChar` into
#   `u8` on Windows, which corrupts Chinese text on the way in and panics on
#   `SQL_DBMS_NAME`. `default-features = false` plus the explicit two features
#   below is what `dm-odbc` was developed and tested against.
# * `dm-dpi` builds on every platform without the Dameng client installed: the
#   `dmdpi.dll` / `libdmdpi.so` handle is opened at *runtime* (`LoadLibraryW` /
#   `dlopen`), so only `-ldl` on non-Windows is a build-time concern, and
#   `dm-dpi/build.rs` adds it itself.
#

dm-dpi = { path = "crates/dameng/dm-dpi" }
dm-error = { path = "crates/dameng/dm-error" }
dm-core = { path = "crates/dameng/dm-core" }
dm-macros = { path = "crates/dameng/dm-macros" }
dm-odbc = { path = "crates/dameng/dm-odbc" }
# `default-features = false` is required, not cosmetic: the dameng crates each
# choose the pool backend through their own `dpi` feature (`dm-query/dpi =
# ["dm-pool/dpi"]`), and cargo refuses to let a member override a workspace
# dependency's defaults ("default-features = false cannot override workspace's
# default-features"). Consumers that want the DPI default backend enable that
# feature, which is how dameng's own workspace root declared this entry.
dm-pool = { path = "crates/dameng/dm-pool", default-features = false }
dm-query = { path = "crates/dameng/dm-query" }
odbc-api = { version = "29.2", default-features = false, features = [
    "odbc_version_3_80",
    "wide",
] }
odbc-sys = "0.31"
rust_decimal = "1"
futures-core = "0.3"
insta = "1"

