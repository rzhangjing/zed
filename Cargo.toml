# Secrets and crypto
# #2234/45c — echo-free interactive secret input (safe termios wrapper; a
# hand-rolled termios arm needs `unsafe`, which the octos workspace denies).
rpassword = "7"
md-5 = "0.10"
fs2 = "0.4"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
secrecy = { version = "0.10", features = ["serde"] }
subtle = "2"
# JWT signing for Google service-account (Vertex AI) auth. Uses `ring` (already
# in tree via rustls) for RS256 — no OpenSSL.
jsonwebtoken = "9"
chacha20poly1305 = "0.10"
argon2 = "0.5"
qrcode = { version = "0.14", default-features = false }
# Keychain (platform-native secure credential storage)
keyring = { version = "3", default-features = false }

# Errors and CLI
eyre = "0.6"
color-eyre = "0.6"
colored = "2"
rustyline = "15"

# Serialization and text extraction
serde_yml = "0.0.12"
htmd = "0.5"

# Storage, search and data
redb = "2"
# Keep the fleet ledger's checked u64/usize conversions on the 0.40 bindings.
# This dependency requires Rust 1.88 or newer; the workspace MSRV is still stale.
rusqlite = { version = "0.40.1", features = ["bundled", "fallible_uint"] }
bincode = "1"
hnsw_rs = "0.3"
