[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

# Octos' workspace tuned `[profile.dev]` differently (see the octos repo's
# Cargo.toml):
#
#   [profile.dev]
#   debug = "line-tables-only"
#   incremental = false
#
#   [profile.dev.package."*"]
#   debug = false
#
# Those settings are deliberately *not* merged: `debug` and `incremental` are
# profile-wide, so importing them would drop Zed's (debuggable backtraces,
# incremental rebuilds) and force a full recompile of the existing target
# directory. Merge them by hand if the merged tree should prefer Octos' small
# dev builds.

# mirror configuration for crates compiled for the build platform
# (without this cargo will compile ~400 crates twice)
[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

# "debug" is a reserved profile name.
[profile.dbg]
inherits = "dev"
debug = "full"

[profile.dbg.build-override]
