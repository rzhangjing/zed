#
# gpui-kit
#
# The gpui-kit stack ("GPUI Kit" by longbridge, Apache-2.0) vendored as workspace
# members under `crates/gpui-kit/`. Its crates originally depended on the
# `gpui-pre-*` snapshots of the upstream Zed crates published to crates.io and on
# the `gpui-fast` renderer; here they are redirected to this fork's own `gpui*`
# crates, and the `gpui-fast` half of their feature tables is removed (nothing in
# this tree vendors it, and Cargo resolves `{ workspace = true }` entries even
# when the dependency is optional).
#

gpui-base = { path = "crates/gpui-kit/base" }
gpui-component = { path = "crates/gpui-kit/component" }
gpui-component-macros = { path = "crates/gpui-kit/component-macros" }
gpui-fps = { path = "crates/gpui-kit/fps" }
gpui-kit = { path = "crates/gpui-kit/kit" }
gpui-kit-assets = { path = "crates/gpui-kit/assets" }
gpui-kit-showcase = { path = "crates/framework/gpui-kit-showcase" }
# Optional syntax highlighting for `gpui-component`'s Markdown, Input and Diff.
# Off by default; the versions are the ones upstream pins.
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
# Vendored, not members: see the comment in the `members` list above.
#gpui-shell = { path = "crates/gpui-shell" }
#gpui-component-shell = { path = "crates/gpui-component-shell" }
#gpui-component-story = { path = "crates/gpui-component-story" }

#
# cesiumrust
#
# Transcribed from `crates/cesiumrust/Cargo.toml`, which was that tree's own
# `[workspace.dependencies]` before it became part of this workspace. Only the
# keys that are *specific* to cesiumrust are repeated here; everything it shares
# with Zed (`serde`, `serde_json`, `toml`, `thiserror`, `image`, `tokio`,
# `flate2`, `tempfile`, `wiremock`, `criterion`) resolves to the entries already
# declared in this table, so those shared versions stay Zed's.
#
# Two deliberate divergences from a literal transcription:
#
#   * `reqwest` is only pulled in by cesium-pipeline's non-default
#     `reqwest-backend` feature, and this workspace's `reqwest` entry is a git
#     dependency (`zed-industries/reqwest`). cesium-pipeline declares its own
#     `reqwest = "0.12"` inline for exactly that reason, and stays on crates.io.
#   * `glam` is declared standalone below rather than inherited from Zed,
#     because Zed has no `glam` entry at all. `features = ["serde"]` matches
#     cesiumrust's declaration, and its `fast-math` caution (see the note in
#     `crates/cesiumrust/Cargo.toml`) is preserved by not enabling it.
#
# The `bevy` feature list is copied verbatim, including `x11`: it is inert on
# Windows but kept identical so that a future diff against upstream cesiumrust
# stays meaningful.
#

glam = { version = "0.29", features = ["serde"] }
earcut = "0.4"
serde-xml-rs = "0.6"
assert_cmd = "2"
ureq = "2"

# Game engine / rendering. Default features disabled: audio (alsa-sys) and gilrs
# (libudev-sys) need system libraries that are not installed on this machine.
#
# `tonemapping_luts` is *not* part of Bevy's defaults for this feature set and is
# required: without it `Camera3d`'s default `Tonemapping::TonyMcMapFace` has no
# LUT to sample, and every mesh draws as nothing (the camera's clear colour is
# all that reaches the target). cesiumrust's own `main.rs` gets it because it
# takes `DefaultPlugins` with Bevy's default features; the explicit list here
# has to name it.
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_pbr",
    "bevy_picking",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "x11",
] }

# Internal cesiumrust crates.
cesium-geospatial = { path = "crates/cesiumrust/domain/geospatial" }
cesium-plot = { path = "crates/cesiumrust/domain/plot" }
cesium-time = { path = "crates/cesiumrust/domain/time" }
cesium-camera = { path = "crates/cesiumrust/domain/camera" }
