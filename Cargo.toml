    "crates/framework/gpui-kit-showcase",
    # The script host and everything built on it are vendored but kept out of the
    # build, because one pinned QuickJS revision could not be fetched into
    # cargo's git db on this machine (the object is absent, so both `--offline`
    # and every retry fail). Sources are complete.
    #
    # To re-enable, fetch the missing revision first, then uncomment the members
    # below, the `[workspace.dependencies]` entries they need and the `rquickjs`
    # patch:
    #
    #   git -C "$env:USERPROFILE\.cargo\git\db\quickjs-jit-85f77f3fd15b7d92" \
    #       fetch --no-tags --force --update-head-ok \
    #       https://github.com/longbridge/quickjs-jit \
    #       +96593cd7a54440ac060a391b8baea7e9a3cf1393:refs/commit/96593cd7a54440ac060a391b8baea7e9a3cf1393
    #
    # (or `$env:CARGO_NET_GIT_FETCH_WITH_CLI='true'; cargo fetch`).
    #
    #"crates/gpui-kit/shell",
    #"crates/gpui-kit/story",
    #"crates/gpui-kit/story-web",
    #"crates/gpui-kit/webview",

