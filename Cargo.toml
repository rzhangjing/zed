pdf-extract = "0.9"
glob = "0.3"
cron = "0.15"
chrono-tz = "0.10"
iana-time-zone = "0.1"

# Media and browser automation
# Audio decoding (pure Rust). WAV is always on (AudioNonSilent validator); MP3
# is gated behind the `audio_mp3` feature on octos-agent.
hound = "3"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
chromiumoxide = "0.9"

# Networking, channels and web API
# Channel integrations (optional, pulled in via feature flags)
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
