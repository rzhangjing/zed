# Tracing and archives
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
flate2 = "1"
tar = "0.4"

# AST parsing (feature-gated)
tree-sitter-javascript = "0.23"

# Testing
tokio-test = "0.4"
wiremock = "0.6"

# --- Merge notes: specs that could not be shared ----------------------------
#
# A workspace table has one entry per dependency name, so where Zed and Octos
# asked for semantically incompatible versions the base (Zed) spec is kept and
# Octos' request is recorded here. The Octos crates that pull the key are
# listed; they need an explicit (non-workspace) version in their own manifest,
# or Zed's spec has to move, before they will compile:
#
#   dirs                     zed 6.0              octos 5       (octos-agent, octos-services, octos-cli)
#   html5ever                zed 0.39             octos 0.35    (octos-agent)
#   markup5ever_rcdom        zed 0.39             octos 0.35    (octos-agent)
#   quick-xml                zed 0.41             octos 0.37    (octos-research, octos-cli)
#   rand                     zed 0.9              octos 0.8     (octos-server, octos-cli)
#   reqwest                  zed fork (zed-reqwest, no `json`/`blocking`)
#                                                 octos crates.io 0.12 (json, stream, rustls-tls, blocking, multipart)
#                                                 (octos-diagnostics, octos-research, octos-llm, octos-agent,
#                                                  octos-bus, octos-services, octos-server, octos-cli)
#   tower-http               zed 0.4.4            octos 0.6     (octos-server, octos-cli)
#   tree-sitter              zed git rev          octos 0.24    (octos-agent)
#   tree-sitter-python       zed 0.25             octos 0.23    (octos-agent)
#   tree-sitter-rust         zed 0.24.2           octos 0.23    (octos-agent)
#   tree-sitter-typescript   zed git rev          octos 0.23    (octos-agent)
#   webpki-roots             zed 1.0.8            octos 0.26    (octos-bus)
#   which                    zed 8                octos 7       (octos-agent, octos-plugin)
#   proptest                 zed git rev          octos 1.11    (octos-bus, dev-dependency)
#
# Two more specs were widened instead of split, because the merged value still
# satisfies both sides (features are additive):
#
#   tokio   zed `{ version = "1" }` + octos `features = ["full"]`
#           -> `{ version = "1", features = ["full"] }`
#   rustls  zed `"0.23.26"` (default features) + octos `default-features = false,
#           features = ["std", "tls12", "ring"]`
#           -> `{ version = "0.23.26", features = ["std", "tls12", "ring"] }`
#           (keeps Zed's default provider and additionally enables `ring`)
#

[workspace.dependencies.windows]
version = "0.62"
