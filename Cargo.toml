    #
    # gpui-kit
    #

    # The upstream GPUI Kit tree, vendored whole under `crates/gpui-kit/` and
    # reduced to the crates Zed builds: the foundation (`base`), the styled
    # components (`component`, `component-macros`), the FPS HUD (`fps`), the
    # facade (`kit`) and its icon set (`assets`).
    #
    # `shell`, `story`, `story-web` and `webview` are vendored alongside them but
    # stay out of the build: `shell` pins a QuickJS revision that cannot be
    # fetched on this machine (see the comment further down), and `webview`
    # selects GPUI Fast, which this tree does not vendor.
    "crates/gpui-kit/base",
    "crates/gpui-kit/component",
    "crates/gpui-kit/component-macros",
