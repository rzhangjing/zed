    #
    # cesiumrust (a CesiumJS rewrite in Rust; see crates/cesiumrust/README.md)
    #
    # Copied in as a self-contained tree that was originally its own workspace
    # (`crates/cesiumrust/Cargo.toml` was a `[workspace]` root). Merging it here
    # cost no edits to any of its member manifests, because they all inherit
    # through `version.workspace = true` / `edition.workspace = true` /
    # `license.workspace = true` / `publish.workspace = true`: now that the
    # outer workspace is the nearest one, they simply inherit Zed's
    # `[workspace.package]` instead of cesiumrust's, so these crates now declare
    # Zed's `Apache-2.0` rather than the `MIT` their old root declared. Its own
    # `crates/cesiumrust/Cargo.toml` is kept as documentation of the original
    # layout and as the source of the `[workspace.dependencies]` block
    # transcribed below; it is no longer a workspace root. `LICENSE-MIT` was
    # added next to it to preserve the licence text the tree was published
    # under, and its `Cargo.lock` was deleted as stale: this workspace's lock is
    # authoritative now, and cargo reported the nested one as needing an update
    # rather than using it.
    #
    # Note that `script/check-licenses` will reject these directories once they
    # are tracked, because it requires a `LICENSE-GPL`/`LICENSE-APACHE`
    # symlink in every crate directory that has a `Cargo.toml`. It is a no-op
    # today: the script reads `git ls-files`, and this tree is untracked.
    #
    # Why the members are listed individually rather than as a directory glob:
    # they live at depth 2 (`domain/*`, `ports/*`, `adapters/*`), which a
    # single-segment `crates/cesiumrust/*` glob does not reach. The grouping
    # below mirrors cesiumrust's own `members` list, plus the three extra
    # directories it kept outside the `[workspace] members` list but that are
    # still real packages here: `specs` (its ported CesiumJS test suite) and the
    # two `tools/` binaries, so that `cargo check -p <member>` works for every
    # crate it used to build.
    #

    # Domain: pure Rust, no framework dependency.
    "crates/cesiumrust/domain/animation",
    "crates/cesiumrust/domain/atmosphere",
    "crates/cesiumrust/domain/camera",
    "crates/cesiumrust/domain/datasource",
    "crates/cesiumrust/domain/event",
    "crates/cesiumrust/domain/geospatial",
    "crates/cesiumrust/domain/globe",
    "crates/cesiumrust/domain/gpx",
    "crates/cesiumrust/domain/imagery",
    "crates/cesiumrust/domain/interaction",
    "crates/cesiumrust/domain/kml",
    "crates/cesiumrust/domain/material",
    "crates/cesiumrust/domain/plot",
    "crates/cesiumrust/domain/quadtree",
    "crates/cesiumrust/domain/resource",
    "crates/cesiumrust/domain/scene-mode",
    "crates/cesiumrust/domain/shadow",
    "crates/cesiumrust/domain/time",

    # Ports: trait contracts.
    "crates/cesiumrust/ports/driven",
    "crates/cesiumrust/ports/driving",

    # Adapters: Bevy/IO implementations.
    "crates/cesiumrust/adapters/bevy-render",
    "crates/cesiumrust/adapters/decoders",
    "crates/cesiumrust/adapters/network",
    "crates/cesiumrust/adapters/pipeline",
    "crates/cesiumrust/adapters/plot-bevy",

    # Application: the Bevy app assembly. `Help > cesiumrust` embeds this one.
    "crates/cesiumrust/application/cesium-app",

    # Test suite ported from CesiumJS Specs, and the two tools.
    "crates/cesiumrust/specs",
    "crates/cesiumrust/tools/gen_offline_assets",
    "crates/cesiumrust/tools/pixel_diff",

    #
    # dameng (达梦数据库驱动、连接池与查询层)
    #
    # Copied in whole from `D:\Rust\dameng`, which was its own workspace. Its
    # crates all inherit `version.workspace` / `edition.workspace` /
    # `rust-version.workspace` / `license.workspace`, so they have to be members
    # here — the nearest `[workspace]` is this one and they now inherit Zed's
    # `[workspace.package]` instead of dameng's.
    #
    # Only the crates a connection needs are listed: the Toasty-facing ones
    # (`toasty-driver-dameng`, `toasty-sql`, and the `dameng` facade that pulls
    # both) are left out, because `Help > Dameng` connects and runs SQL, and
    # nothing in this build wants an ORM. `dm-migrate` is left out with them (it
    # depends on toasty's SQL layer too).
    #

    "crates/dameng/dm-error",
    "crates/dameng/dm-core",
    "crates/dameng/dm-macros",
    "crates/dameng/dm-odbc",
    "crates/dameng/dm-dpi",
    "crates/dameng/dm-pool",
    "crates/dameng/dm-query",

    #
    # fundamental (基础库)
    #
    # `ew_ordpack`: schema-driven binary serialization, copied in whole from
    # `E:\Rust\ew-ordpack`, which was its own workspace. Both the facade crate
    # and its proc-macro crate have to be members: the derive crate would
    # otherwise be adopted by a nested `[workspace]` root and resolve its
    # dependencies against that manifest instead of this one.
    #
    "crates/fundamental/ew_ordpack",
    "crates/fundamental/ew_ordpack/ew_ordpack_derive",
    #
    # `ew_operate_record`: user-operation logging over SQLite, copied in whole
    # from `E:\Rust\ew-operate-record`, which was its own workspace. The
    # `[profile.release]` it carried (`lto = "thin"`, `codegen-units = 1`) is
    # dropped on the way in: a member cannot set profiles, and this root already
    # uses thin LTO with one codegen unit for release.
    #
    "crates/fundamental/ew_operate_record",
    #
    # `ew_types`: Rust type cards for LLM consumption, copied in whole from
    # `E:\Rust\标准规范\types`, which was its own workspace. Its empty
    # `[workspace]` table and `[profile.release]` (`strip = true`, `lto = true`)
    # are dropped on the way in: a member cannot set profiles, and the root
    # release profile (`debug = "limited"`, `lto = "thin"`, `codegen-units = 1`)
    # is the one that applies. The package is named `ew_types`; its lib target
    # is also `ew_types` and its bin target stays `ew-types`. `demo/` carries its
    # own `[workspace]` root and is `exclude`d below so cargo cannot adopt it.
    #
    "crates/fundamental/ew_types",
]
default-members = ["crates/framework/zed"]

# `crates/admin` is the topcoat demo (`Help > Admin Demo`) and `crates/topcoat`
# is the copy of topcoat it is built against. Each keeps its own workspace root
# (they inherit `workspace.package`/`workspace.dependencies` from it), and
# `crates/framework/zed` reaches `crates/admin` as a path dependency. Excluding
# both trees keeps cargo from adopting them as members of this workspace, which
# would make every `workspace = true` key in their manifests resolve against this
# file instead (and fail: this file has no `description` and no topcoat table).
# `crates/fundamental/ew_types/demo` is a standalone `[workspace]` root that ships
# with ew_types (a demo crate for the extractor); excluding it keeps cargo from
# trying to make it a member while leaving its contents untouched.
exclude = [
    "vendor/octocrab",
    "crates/admin",
    "crates/topcoat",
    "crates/fundamental/ew_types/demo",
]

[workspace.package]
publish = false
edition = "2024"

# Octos' own crates inherit these (`version.workspace = true` and friends), so
# the merged workspace has to carry them. Zed's crates inherit only `edition`
# and `publish`, so adding them changes nothing for Zed.
version = "2.0.3-rc.13"
rust-version = "1.85.0"
authors = ["octos team"]
license = "Apache-2.0"
repository = "https://github.com/octos-org/octos"

[workspace.dependencies]

