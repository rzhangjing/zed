[patch.crates-io]
# GPUI Kit's script host and the LLRT modules it pins name their QuickJS
# bindings `rquickjs`; routing them through this source-compatible facade keeps
# the shell and LLRT on one `quickjs-jit` VM. Re-enable together with the
# `gpui-shell` members listed above.
#rquickjs = { path = "crates/gpui-shell/rquickjs-compat" }
# Unify `tree_sitter_language::LanguageFn` between crates.io grammar crates and
# the git tree-sitter above; two instances of the crate would make grammar
# constants type-incompatible with `tree_sitter::Language`.
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
