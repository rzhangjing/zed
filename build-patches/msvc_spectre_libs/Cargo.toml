[package]
name = "msvc_spectre_libs"
version = "0.1.3"
edition = "2021"
build = "build.rs"
description = "Local no-op stub replacing msvc_spectre_libs so MSVC builds no longer require the Spectre-mitigated CRT libraries (avoids the build.rs panic)."
license = "MIT OR Apache-2.0"

# The upstream `pet-*` crates depend on msvc_spectre_libs with `features = ["error"]`.
# We must keep an (empty) `error` feature so that dependency request still resolves;
# the stub simply does nothing with it.
[features]
error = []

[lib]
path = "src/lib.rs"
