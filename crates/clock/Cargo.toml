[package]
# Renamed from `clock` when the Octos workspace was merged in: Octos ships a
# bin-only skill crate (`crates/octos/app-skills/time`) whose package name is also
# `clock`, and a Cargo workspace cannot hold two packages with the same name.
# The dependency key stays `clock` (see the workspace table in the root
# Cargo.toml), so `clock.workspace = true` and `use clock::…` are unchanged.
name = "zed-clock"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/clock.rs"
doctest = false

[features]
test-support = ["dep:parking_lot"]

[dependencies]
parking_lot = { workspace = true, optional = true }
serde.workspace = true
smallvec.workspace = true
