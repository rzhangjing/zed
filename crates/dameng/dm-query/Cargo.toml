[package]
name = "dm-query"
description = "达梦查询层：RowSet/Row/RowStream、Args/IntoArgs、FromRow、事务外观、批处理"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dm-error.workspace = true
dm-core.workspace = true
# `default-features = false`：后端开关由本 crate 的 `dpi` feature 决定（默认开），
# 否则 `dm-pool` 的默认 feature 会把它锁死。
dm-pool = { workspace = true, default-features = false }
dm-odbc.workspace = true
futures-core.workspace = true
tracing.workspace = true
chrono = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }

[features]
default = ["chrono", "decimal", "dpi"]
chrono = ["dep:chrono", "dm-core/chrono"]
decimal = ["dep:rust_decimal", "dm-core/decimal"]
# 把默认后端切到 DPI（dm_pool::DefaultBackend 换成 dm_dpi::DpiBackend）。
dpi = ["dm-pool/dpi"]

[dev-dependencies]
# 集成测试是独立 crate，`#[tokio::test]` 与 `tokio::time::timeout` 都要在这里声明。
tokio.workspace = true
dm-macros.workspace = true
insta.workspace = true
# AC-09 的慢查询证据要**断言 warn 真的打出来了**（含指纹与行数），所以需要一个
# 能把日志收进内存的 subscriber；本 crate 只在测试里用，不进库的依赖图。
tracing-subscriber = "0.3"

[[bench]]
# V-07 的增速固化（设计方案 §12.3 T6.6）。自己当 main：项目惯例是能不加依赖就不加，
# 没有统计显著性诉求时 `criterion` 不值得一个第三方依赖（同 M4 未引入 `dhat`）。
name = "batch_insert"
harness = false

[[bench]]
# AC-12 前半的「自研开销」：假后端（无驱动、无网络）下 `select 1` 的单次开销。
# 与 `batch_insert` 同样自己当 main，不引 `criterion`。
name = "overhead"
harness = false

[[example]]
# 性能基准（100 字段宽表 / 20 字段二进制表）。它用 `chrono::NaiveDateTime` 造时间列，
# 因此在 `--no-default-features --features decimal` 这类「没有 chrono」的特性组合里不该被编译
# （Round 41 的门禁 feature-matrix 阶段就是这么抓到它的）。
name = "perf_bench"
required-features = ["chrono"]
