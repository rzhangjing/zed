[package]
name = "ew_operate_record"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Embedded user-operation logging middleware: record what users do into SQLite."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["audit", "operation-log", "middleware", "sqlite"]
categories = ["database"]

[dependencies]
# Kept in step with the workspace's `rusqlite` (0.41): `libsqlite3-sys` declares
# `links = "sqlite3"`, so a second, differently-versioned rusqlite anywhere in
# the graph is a hard error. RustGIS 0.6.0 (`crates/rustgis`) pins 0.41.
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
