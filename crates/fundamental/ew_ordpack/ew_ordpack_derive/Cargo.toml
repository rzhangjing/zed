[package]
name = "ew_ordpack_derive"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Derive macros for ew_ordpack"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["derive", "parsing", "printing", "proc-macro"] }
