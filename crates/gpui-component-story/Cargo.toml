[package]
name = "gpui-component-story"
version = "0.7.1"
publish = false
edition.workspace = true

[features]
inspector = ["gpui-kit/inspector"]
tree-sitter = ["gpui-kit/tree-sitter-languages"]
test-support = ["gpui-kit/test-support"]
default = ["tree-sitter"]

[dependencies]
anyhow.workspace = true
gpui-kit = { workspace = true, features = ["speech"] }
gpui-fps.workspace = true

async-channel.workspace = true
autocorrect = "2.14.2"
chrono.workspace = true
csv = "1.4"
fake = { version = "2.10.0", features = ["dummy"] }
itertools.workspace = true
rand = "0.8"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.22", features = [
  "env-filter",
  "fmt",
  "registry",
], default-features = false }
unindent.workspace = true
rust-i18n.workspace = true
dirs.workspace = true

# Native-only dependencies (not available on WASM)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui-shell.workspace = true
reqwest_client.workspace = true
smol.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# WASM has no tree-sitter grammars, so the Editor story highlights with
# `syntect` there. Native uses the built-in tree-sitter highlighter.
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
# `rand 0.8` (via `fake`) does not enable the `js` feature of getrandom,
# which is required to build for wasm32-unknown-unknown.
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
