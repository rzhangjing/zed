[package]
name = "gpui-kit-assets"
description = "Default bundled assets for GPUI Kit."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
license = "Apache-2.0"
documentation = "https://docs.rs/gpui-kit-assets"
homepage = "https://gpui-kit.com"
repository = "https://github.com/longbridge/gpui-kit"
readme = "README.md"
edition.workspace = true
publish = true
version = "0.7.1"

# Retain Cargo icon-directory metadata for existing build-script consumers.
links = "gpui-kit-default-icons"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
gpui.workspace = true
log.workspace = true

[dev-dependencies]
gpui_platform.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rust-embed = { workspace = true, features = ["interpolate-folder-path"] }

[target.'cfg(target_family = "wasm")'.dependencies]
reqwest.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
