[package]
name = "gpui-kit-assets"
description = "Default bundled assets for GPUI Kit."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
license = "Apache-2.0"
documentation = "https://docs.rs/gpui-kit-assets"
homepage = "https://gpui-kit.com"
repository = "https://github.com/longbridge/gpui-kit"
readme = "README.md"
edition.workspace = true
publish = true
version = "0.7.3"

# Retain Cargo icon-directory metadata for existing build-script consumers.
links = "gpui-kit-default-icons"

[dependencies]
anyhow.workspace = true
gpui.workspace = true
log.workspace = true

[dev-dependencies]
gpui_platform.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path", "include-exclude"] }

[target.'cfg(target_family = "wasm")'.dependencies]
reqwest = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[features]

# The vendored sources still carry `#[cfg(feature = "gpui-fast")]` arms, but
# this tree removed that feature (`[workspace.dependencies]` in the root
# manifest explains why). The workspace's `unexpected_cfgs = { level = "allow" }`
# is how the sibling gpui-kit crates (base, component, kit, fps) already silence
# the resulting warning; this crate was the only gpui-kit member not opted in.
[lints]
workspace = true
