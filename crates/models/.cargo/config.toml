# `crates/models` is its own workspace root (excluded from the Zed workspace).
# Its Burn dependency tree is not in the repository-level `vendor/`, so this
# crate vendors its own copy under `crates/models/vendor` (gitignored) and
# replaces crates-io with it. This file is deeper than `E:\Rust\zed\.cargo`
# and therefore wins for anything built from this directory.
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[net]
offline = true

[env]
# `kmeans` 2.0.2 is published with `#![feature(portable_simd)]` and
# `extern crate test` in its lib root, so it cannot build on a stable toolchain
# as-is. This crate-local opt-in (it applies only to `crates/models` cargo
# invocations) lets the installed stable 1.98 compiler accept that one
# dependency; the demo's own code and every other dependency stay stable Rust.
RUSTC_BOOTSTRAP = "1"
