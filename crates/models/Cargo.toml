[package]
name = "models"
version = "0.1.0"
edition = "2024"
publish = false
description = "Burn CNN + Transformer demo CLI (train / test / cluster) over models_core"

[lib]
name = "models"
path = "src/lib.rs"

[[bin]]
name = "models"
path = "src/main.rs"

[dependencies]
# All of the demo's logic (model, data, training loop, checkpoints and the
# clustering bridge) lives in the root member `crates/fundamental/models-core`,
# which is also what the Model Test window calls in-process. This crate is only
# the CLI shell.
#
# `nightly-kmeans` stays off: the workspace builds with the pinned stable
# toolchain, so `kmeans 2.0.2` cannot be compiled. `models cluster --algo kmeans`
# therefore reports itself as unavailable, exactly like the Model Test window's
# K-Means button. Everything else (the other seven clustering algorithms, Burn
# training and evaluation) is unaffected.
models_core.workspace = true
clap.workspace = true
