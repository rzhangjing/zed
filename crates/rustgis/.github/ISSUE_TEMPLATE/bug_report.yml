name: Bug report
description: Report unexpected behavior or a possible flaw in RustGIS.
title: "[Bug]: "
labels: ["unconfirmed possible issue"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please fill out the sections below so we can reproduce and confirm the issue.

        Reports start as **unconfirmed possible issue**. Once a maintainer reproduces the problem, it is promoted to **bug**.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the [existing issues](https://github.com/opengeos/RustGIS/issues) and did not find a duplicate.
          required: true
        - label: This is a bug report, not a usage question (questions belong in [Discussions](https://github.com/opengeos/RustGIS/discussions)).
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the unexpected behavior.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Tell us how to reproduce the behavior, step by step. For the command line, include the full `rustgis-cli` command.
      placeholder: |
        1. Open '...'
        2. Add data '...'
        3. Click on '...' in the ribbon
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: How are you running RustGIS?
      options:
        - Desktop app (downloaded release)
        - Desktop app (built from source)
        - Web app (https://web.rustgis.app)
        - Command line (rustgis-cli)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release version, or the commit if you built from source (`git rev-parse --short HEAD`).
      placeholder: v0.1.0 / abc1234
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system, browser and graphics
      description: e.g. Windows 11 + NVIDIA RTX 3060, macOS 15 (Apple M2), Ubuntu 24.04 on Wayland, Chrome 130 with WebGPU.
    validations:
      required: false
  - type: textarea
    id: data
    attributes:
      label: Sample data
      description: If the bug is tied to a specific dataset or project (`.rgis`), share a small sample or a link so we can reproduce it.
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: 'Add screenshots, screen recordings, or terminal output if they help explain the problem. If the desktop app closed unexpectedly, attach `crash.log` or `crash-last.log` from its settings folder (`%APPDATA%\RustGIS` on Windows, `~/Library/Application Support/RustGIS` on macOS, `$XDG_CONFIG_HOME/rustgis` or `~/.config/rustgis` on Linux). Read it first: an error message can include file paths or layer names, so remove anything you don''t want to share.'
    validations:
      required: false
