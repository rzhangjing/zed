[package]
name = "sandbox"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/sandbox.rs"

[features]
# Builds `wsl_sandbox_test_helper`, which drives the real WSL/Bubblewrap sandbox
# end-to-end (run it with `script/test-wsl-sandbox.ps1`, or directly via
# `cargo run -p sandbox --features wsl-test --bin wsl_sandbox_test_helper`). Off
# by default so normal builds and the workspace test run don't produce it.
wsl-test = []

# Behavior test helper for the Windows WSL/Bubblewrap sandbox. Only built when
# the `wsl-test` feature is enabled (and only meaningful on Windows).
[[bin]]
name = "wsl_sandbox_test_helper"
path = "src/wsl_sandbox_test_helper.rs"
required-features = ["wsl-test"]

[dependencies]
anyhow.workspace = true
futures.workspace = true
http_proxy.workspace = true
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
# Safe wrappers for the SCM_RIGHTS fd-passing and `fstat` the bind validator
# needs, so that code doesn't hand-roll `msghdr`/`CMSG_*`/`mem::zeroed` unsafe.
nix = { workspace = true, features = ["fs", "socket", "uio"] }
# Builds the in-sandbox seccomp-BPF filter that blocks the untrusted command from
# creating `AF_UNIX` (and other non-IP) sockets, `io_uring`, `ptrace`, etc. — the
# syscall-level half of preventing session-IPC-socket sandbox escapes.
seccompiler.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true
# For the `#[gpui::property_test]` in the writable-grant normalization tests.
# `proptest` comes transitively via `gpui::proptest`.
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
smol.workspace = true
# Structural WSL-installed check (registered distros under HKCU\...\Lxss)
# without spawning `wsl.exe`.
windows-registry.workspace = true
