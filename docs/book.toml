# NOTE (this fork): `crates/docs_preprocessor` has been removed from this fork, so
# this preprocessor cannot run any more. The section below is commented out rather
# than deleted, so the original intent stays visible.
#
# Consequence: the `{#kb scope::Action}` and `{#action scope::Action}` markers in
# `src/**` are no longer expanded and will appear literally in the built HTML.
# Fixing that needs the removed crate back; it is not a config-level problem.
#
# Upstream text follows, with the section itself commented out:
#
# Our custom preprocessor for expanding commands like `{#kb action::ActionName}`,
# and other docs-related functions.
#
# Comment the below section out if you need to bypass the preprocessor for some reason.
# [preprocessor.zed-docs-preprocessor]
# command = "cargo run -p docs_preprocessor --"
# renderer = ["html", "zed-html"]
