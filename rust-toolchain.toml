[toolchain]
# Windows GNU (mingw-w64) host, see docs/src/development/windows.md. The host
# triple must be spelled out: a bare `1.98.1` resolves to the rustup default
# host (msvc on most machines) and silently ignores this file's intent.
channel = "1.98.1-x86_64-pc-windows-gnu"
profile = "minimal"
# No `rust-analyzer`: upstream publishes it for msvc hosts only.
components = [ "rustfmt", "clippy", "rust-src" ]
targets = [
    "wasm32-wasip2", # extensions
    "wasm32-unknown-unknown", # gpui on the web
    "x86_64-unknown-linux-musl", # remote server
]

