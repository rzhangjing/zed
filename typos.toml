[files]
ignore-files = true
ignore-hidden = false
extend-exclude = [
    # --- Zed / gpui-component (pre-existing) ---
    ".git/",

    # Contributor names aren't typos.
    ".mailmap",

    # File suffixes aren't typos.
    "crates/theme/src/icon_theme.rs",

    # Vendored JSON schemas from SchemaStore.
    "crates/json_schema_store/src/schemas/",

    # Not our typos.
    # Editor, file finder, and fuzzy matching rely on partial typing and custom in-string syntax.
    "crates/file_finder/src/file_finder_tests.rs",
    "crates/fuzzy_nucleo/src/strings.rs",
    "crates/editor/src/editor_tests.rs",
    "crates/editor/src/edit_prediction_tests.rs",
    # We have some base64-encoded data that is incorrectly being flagged.
    "crates/rpc/src/auth.rs",
    # Windows likes its abbreviations.
    "crates/gpui_windows/src/directx_renderer.rs",
    "crates/gpui_windows/src/events.rs",
    "crates/gpui_windows/src/direct_write.rs",
    "crates/gpui_windows/src/window.rs",
    # Some typos in the base mdBook CSS.
    "docs/theme/css/",
    # Automatically generated JS.
    "docs/theme/c15t@*.js",
    # Spellcheck triggers on `|Fixe[sd]|` regex part.
    "script/danger/dangerfile.ts",
    # File type extensions are not typos
    "crates/zed/resources/windows/zed.iss",
    # typos-cli doesn't understand our `vˇariable` markup
    "crates/editor/src/hover_links.rs",
    # typos-cli doesn't understand `setis` is intentional test case
    "crates/editor/src/code_completion_tests.rs",
    # Linux repository structure is not a valid text, hence we should not check it for typos
    "crates/project_panel/benches/linux_repo_snapshot.txt",
    # Some multibuffer test cases have word fragments that register as typos
    "crates/multi_buffer/src/multi_buffer_tests.rs",
    # Tests contain partially incomplete words (by design)
    "crates/edit_prediction_metrics/src/kept_rate.rs",
    # Tests contain `baˇr` that cause `"ba" should be "by" or "be".`-like false-positives
    "crates/editor/src/document_symbols.rs",

    # --- Octos (merged) ---
    "**/*.js",
    "**/*.css",
    "**/*.html",
    "examples/*/static/**/*.*",
    # Recorded provider responses (metasearch engine fixtures): third-party
    # text and encoded IDs, replayed byte-for-byte by the fixture tests.
    "crates/octos-research/engines/*/fixtures/**",
]

[default]
extend-ignore-re = [
    # PNG is a file format, not a typo
    "PNG",
    'cl\[ist]',
    '\[lan\]guage',
    '"ba"',
    "doas",
    # ProtoLS crate with tree-sitter Protobuf grammar.
    "protols",
    # x11rb SelectionNotifyEvent struct field
    "requestor",
    # macOS version
    "Big Sur",
    # Not an actual typo but an intentionally invalid color, in `color_extractor`
    "#fof",
    # Stripped version of reserved keyword `type`
    "typ",
    # AMD GPU Services
    "ags",
    # AMD GPU Services
    "AGS",
    # "noet" is a vim variable (ideally to ignore locally)
    "noet",
    # Yarn Plug'n'Play
    "PnP",
    # `image` crate method: Delay::from_numer_denom_ms
    "numer",
    # Abbreviation for foreignObject in mermaid SVG processing
    "fo",
    # Mermaid CSS class name for state diagram composites
    "composit",
    # Used in truncating tests to ensure byte-length vs char like in café
    "caf…",
    '\[elete\]',
    "GHIzJ",
    # Intentionally non-matching query in project search tests
    "NOTHINGmATCHEStHIS",
]

# Octos (merged): *sigh* this just isn't worth the cost of fixing.
extend-ignore-identifiers-re = [
    "AttributeID.*Supress.*",
]

check-filename = true

# Octos (merged)
[default.extend-identifiers]
# *sigh* this just isn't worth the cost of fixing
AttributeIDSupressMenu = "AttributeIDSupressMenu"

[default.extend-words]
# --- Zed / gpui-component (pre-existing) ---
scap = "scap"
writeable = "writeable"

# --- Octos (merged) ---
# Intentional typo fixture in mcp.rs / m8_integration_concurrency.rs:
# both tests assert that the parser correctly REJECTS "exlusive" as
# an invalid concurrency_class value. Allowlist the misspelling so
# the typos lint doesn't flag the negative-test JSON literal.
exlusive = "exlusive"
# "OLL" (Octos Lesson Language): the learning-coach skill's tool names
# (`oll_generate_lesson`) and output paths used by the acceptance tests.
oll = "oll"
# Don't correct the surname "Teh"
teh = "teh"
Hashi = "Hashi"
consts = "consts"
# Voice preset name (ono_anna)
ono = "ono"
# WeChat API event name
scaned = "scaned"
# Timezone abbreviation (IST)
ist = "ist"
# Channel NewsAsia (CNA), a publisher-feeds source
CNA = "CNA"
# Test data fragment in SSE test
hel = "hel"
# Homoglyph security test string
nore = "nore"
# WhatsApp API field name
pn = "pn"
# Both spellings are acceptable
unparseable = "unparseable"
# Base64 placeholder token
iz = "iz"
# Deliberate mid-token chunk split of "</think>" in the stream-splitter test
# (octos-llm types.rs) — the split point IS the test.
thi = "thi"
# "borderline" label abbreviation in the deepseek routing probe test
bord = "bord"
# One-Time Passwords (OTPs)
ot = "ot"
# Rust TUI library name
ratatui = "ratatui"
# English prefix "mis-" (misclassification, miscount, etc.)
mis = "mis"
# Constant-time equality test fixture (intentionally 1-byte diff from "abc")
abd = "abd"
# Intentional typo fixture in manifest_validator.rs: tests that the validator
# rejects "strng" as an invalid type-string value (it's a deliberate typo for
# "string"). Allowlist the misspelling so the typos lint doesn't flag the
# negative-test JSON literal.
strng = "strng"
# Consent-dialog phrases in other languages (German, French), matched by
# octos-research's consent detector and its tests (access.rs, README).
alle = "alle"
sie = "sie"
ein = "ein"
mesure = "mesure"
# Spanish word for "advances" — test corpus in octos-research/src/extract.rs
avances = "avances"
# Basic Regular Expression — referenced in slides validator spec comments
# explaining the regex escape behavior for find -name patterns.
BRE = "BRE"
# POSIX open(2) flag (O_WRONLY), not a misspelling of "wrongly"
WRONLY = "WRONLY"
